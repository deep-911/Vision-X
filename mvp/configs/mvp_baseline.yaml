experiment_name: mvp_baseline_sanity
dataset:
  name: idrid_grading
  img_size: [224, 224]
  batch_size: 4
  num_workers: 0
model:
  name: efficientnet_b0
  num_classes: 5
  type: classification  # or ordinal
training:
  epochs: 2
  lr: 0.001
  mixed_precision: true
  checkpoint_dir: artifacts/checkpoints
  seed: 42
eval:
  referable_threshold: 2
