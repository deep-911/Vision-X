# final_project/configs/aptos_grading.yaml
# APTOS 2019 Base Reference Model (EfficientNet-B0 + Softmax)

experiment_name: "aptos_baseline_softmax"
project: "VisionX"
task: "5-class DR grading"

data:
  dataset_name: "aptos"
  dataset_root: "Datasets/aptos/raw_aptos"
  train_split: "train"
  val_split: "val"
  holdout_split: "test" # Internal holdout, MUST remain locked
  img_size: [224, 224]
  augment: true
  imbalance_strategy: "class_weights"

dataset:
  img_size: [224, 224]
  batch_size: 16
  num_workers: 0

model:
  architecture: "EfficientNet-B0"
  type: "classification" # Baseline A (Softmax)
  num_classes: 5
  pretrained_weights: "EfficientNet_B0_Weights.DEFAULT"

training:
  seed: 42
  epochs: 15
  lr: 0.0005
  weight_decay: 0.0001
  mixed_precision: true
  checkpoint_rule: "max_val_qwk"
  checkpoint_dir: artifacts/checkpoints
  metrics_dir: artifacts/metrics
  metrics: ["qwk", "accuracy", "referable_sensitivity", "referable_specificity", "brier_score"]

eval:
  referable_threshold: 2
