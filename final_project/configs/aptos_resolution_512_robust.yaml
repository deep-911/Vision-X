# final_project/configs/aptos_resolution_512_robust.yaml
experiment_name: "aptos_baseline_softmax_512_robust"
project: "VisionX"
task: "5-class DR grading"

data:
  dataset_name: "aptos"
  dataset_root: "Datasets/aptos/raw_aptos"
  train_split: "train"
  val_split: "val"
  holdout_split: "test"
  img_size: [512, 512]
  augment: true
  imbalance_strategy: "class_weights"
  augment_type: "robust"

dataset:
  batch_size: 4
  num_workers: 0

model:
  architecture: "EfficientNet-B0"
  type: "classification"
  num_classes: 5
  pretrained_weights: "EfficientNet_B0_Weights.DEFAULT"

training:
  seed: 42
  epochs: 15
  lr: 0.0005
  weight_decay: 0.0001
  mixed_precision: true
  accumulation_steps: 4
  checkpoint_rule: "max_val_qwk"
  checkpoint_dir: artifacts/checkpoints
  metrics_dir: artifacts/metrics
  metrics: ["qwk", "accuracy", "referable_sensitivity", "referable_specificity", "brier_score"]

eval:
  referable_threshold: 2
